spring:
  application:
    name: kafkaCon

  datasource:
    url: jdbc:postgresql://localhost:5433/master_item
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: baibhabnayak3121218

  jpa:
    hibernate:
      ddl-auto: update  # Use 'update' instead of 'auto' to prevent accidental schema loss
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: consumer-group-1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Define Kafka topics separately
kafka:
  topic:
    main: "my-topic"  # Main Kafka topic
    fallback: "my-fallback-topic"  # Fallback topic for failed messages
