# Application Name
spring.application.name=cache2

# Connecting to the Database
logging.level.org.springframework=info
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/cache_proj
spring.datasource.username=postgres
spring.datasource.password=baibhabnayak3121218

# HikariCP Configuration (Spring Boot uses HikariCP by default)
# Uncomment if needed
# spring.datasource.hikari.pool-name=HikariPool-1
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false  

# Redis Configuration (if you're using Redis)
spring.redis.host=localhost
spring.redis.port=6379

# Server Port
server.port=8080

# Enable JMX for Spring Boot (necessary for Tomcat metrics and JVM monitoring)
spring.jmx.enabled=true
spring.jmx.default-domain=cache2
spring.jmx.mbean-domain=org.apache.catalina

# Expose Prometheus Metrics Endpoint
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.jmx.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Enable Tomcat Access Logs
management.server.tomcat.accesslog.enabled=true
management.server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

# Enable Web Request Metrics
management.metrics.web.server.request.autotime.enabled=true

## Enable Tomcat Metrics
management.metrics.web.tomcat.enabled=true
management.metrics.web.tomcat.threads.enabled=true
management.metrics.web.tomcat.sessions.enabled=true

# Additional Tomcat Thread Pool & Request Metrics
management.metrics.web.tomcat.threadpool.enabled=true
management.metrics.web.tomcat.threadpool.include-idle=true

